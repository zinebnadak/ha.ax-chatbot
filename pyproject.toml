[project]
name = "ha-rag-package"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "crawl4ai",
    "deepeval>=4.1.3",
    "deepteam>=1.0.7",
    "fastapi[standard]>=0.140.2",
    "openai>=2.46.0",
    "playwright>=1.61.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "ragas>=0.4.3",
    "selenium>=4.46.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]