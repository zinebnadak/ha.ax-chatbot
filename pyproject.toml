[project]
name = "ha-rag-package"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "chromadb>=1.5.9",
    "cohere>=7.0.8",
    "crawl4ai",
    "deepeval>=4.1.3",
    "deepteam>=1.0.7",
    "fastapi[standard]>=0.140.2",
    "google-genai>=2.18.1",
    "openai>=2.46.0",
    "playwright>=1.61.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "selenium>=4.46.0",
    "voyageai>=0.5.0",
]

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
